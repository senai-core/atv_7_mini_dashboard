<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mulberry — Um índice musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Italiana&family=Kode+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-bg" aria-hidden="true"></div>

    <div class="main-container">
        <main class="main-content">
            <header class="header">
                <div class="masthead">
                    <span>Vol. 01</span>
                    <span class="masthead-rule" aria-hidden="true"></span>
                    <span>Música &amp; Registro</span>
                    <span class="masthead-rule" aria-hidden="true"></span>
                    <span class="masthead-edition">Ed. 2026</span>
                </div>
                <div class="logo-container">
                    <h1 class="logo-text">Mulberry</h1>
                    <span class="logo-tagline"><em>um índice musical, editado por você</em></span>
                </div>
            </header>

            <section class="filters-container" aria-label="Filtros">
                <div class="filter-wrapper">
                    <button id="filterBtn" type="button" class="filter-trigger" aria-haspopup="menu" aria-expanded="false">
                        <span class="filter-trigger-label">Filtros</span>
                        <span class="filter-trigger-arrow" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/>
                            </svg>
                        </span>
                    </button>
                    <div id="filterDropdown" class="filter-dropdown" role="menu"></div>
                </div>

                <div class="search-wrapper">
                    <span class="search-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="11" cy="11" r="7"/>
                            <path stroke-linecap="round" d="m20 20-3.5-3.5"/>
                        </svg>
                    </span>
                    <input type="text" id="searchInput" placeholder="Procurar — música, artista, gênero" class="search-input" aria-label="Buscar">
                    <button id="profileBtn" type="button" class="profile-trigger" aria-label="Editar perfil">
                        <img id="profileAvatar" alt="" class="profile-trigger-img" hidden>
                        <svg id="profileAvatarFallback" class="profile-trigger-fallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                            <circle cx="12" cy="8" r="4"/>
                            <path stroke-linecap="round" d="M4 21c1.5-4.5 5-7 8-7s6.5 2.5 8 7"/>
                        </svg>
                    </button>
                </div>
            </section>

            <section class="music-grid" id="musicGrid" aria-label="Lista de músicas"></section>
        </main>

        <aside class="sidebar">
            <button id="addMusicBtn" class="add-music-btn">
                <span class="plus-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" d="M12 5v14m-7-7h14"/>
                    </svg>
                </span>
                <span class="add-music-label">Novo registro</span>
                <span class="add-music-arrow" aria-hidden="true">→</span>
            </button>

            <section class="chart-block" aria-label="Distribuição por gênero">
                <h3 class="chart-title">Planilha de gêneros</h3>
                <div class="chart-container">
                    <canvas id="genreChart"></canvas>
                </div>
                <div class="chart-legend" id="chartLegend"></div>
            </section>

            <section class="total-block" aria-label="Resumo">
                <span class="total-colophon" aria-hidden="true">№</span>
                <p class="total-label">Total de músicas salvas</p>
                <div class="total-content">
                    <span id="totalMusics" class="total-number">0</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <p class="stat-label">Duração</p>
                        <p id="totalDuration" class="stat-value">00:00:00</p>
                    </div>
                    <div class="stat-divider" aria-hidden="true"></div>
                    <div class="stat-item">
                        <p class="stat-label">Ouvintes/mês</p>
                        <p id="totalListeners" class="stat-value">0</p>
                    </div>
                </div>
            </section>
        </aside>
    </div>

    <footer class="footer">
        <span>AT07 · Mulberry · vanilla HTML/CSS/JS</span>
        <span class="footer-rule" aria-hidden="true"></span>
        <span class="footer-colophon">№ 01</span>
    </footer>

    <!-- Add-music modal -->
    <div id="addMusicModal" class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-heading">
                    <p class="modal-eyebrow">Novo registro</p>
                    <h2 id="modalTitle" class="modal-title">Adicionar música</h2>
                </div>
                <button id="closeAddMusic" class="close-btn" aria-label="Fechar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                        <path stroke-linecap="round" d="M6 18 18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form id="addMusicForm" class="form">
                <div class="form-row">
                    <label class="form-label" for="fNome">Nome da música</label>
                    <input id="fNome" type="text" name="nome" required class="form-input">
                </div>
                <div class="form-row">
                    <label class="form-label" for="fAlbum">Álbum</label>
                    <input id="fAlbum" type="text" name="album" required class="form-input">
                </div>
                <div class="form-row">
                    <label class="form-label" for="fArtista">Artista</label>
                    <input id="fArtista" type="text" name="artista" required class="form-input">
                </div>
                <div class="form-grid">
                    <div class="form-row">
                        <label class="form-label" for="fGenero">Gênero</label>
                        <select id="fGenero" name="genero" required class="form-input">
                            <option value="">Selecione</option>
                            <option value="Blues">Blues</option>
                            <option value="MPB">MPB</option>
                            <option value="Rock">Rock</option>
                            <option value="Metal">Metal</option>
                            <option value="Grunge">Grunge</option>
                            <option value="Heavy Metal">Heavy Metal</option>
                            <option value="Groove Metal">Groove Metal</option>
                            <option value="Countrycore">Countrycore</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label class="form-label" for="fDuracao">Duração</label>
                        <input id="fDuracao" type="text" name="duracao" placeholder="3:45" required pattern="[0-9]+:[0-5][0-9]" class="form-input">
                    </div>
                </div>
                <div class="form-row">
                    <label class="form-label" for="fOuvintes">Ouvintes mensais</label>
                    <input id="fOuvintes" type="number" name="ouvintes_mensais" required min="0" class="form-input">
                </div>
                <div class="form-row">
                    <label class="form-label" for="fImagem">URL da imagem</label>
                    <input id="fImagem" type="url" name="url_imagem" placeholder="https://" class="form-input">
                </div>
                <button type="submit" class="submit-btn">
                    <span>Adicionar</span>
                    <span class="submit-arrow" aria-hidden="true">→</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Profile modal -->
    <div id="profileModal" class="modal" role="dialog" aria-labelledby="profileModalTitle" aria-modal="true">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-heading">
                    <p class="modal-eyebrow">Identidade</p>
                    <h2 id="profileModalTitle" class="modal-title">Editar perfil</h2>
                </div>
                <button id="closeProfileModal" class="close-btn" aria-label="Fechar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                        <path stroke-linecap="round" d="M6 18 18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form id="profileForm" class="form">
                <div class="profile-preview">
                    <div class="profile-preview-frame">
                        <img id="profilePreviewImg" alt="" class="profile-preview-img" hidden>
                        <svg id="profilePreviewFallback" class="profile-preview-fallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                            <circle cx="12" cy="8" r="4"/>
                            <path stroke-linecap="round" d="M4 21c1.5-4.5 5-7 8-7s6.5 2.5 8 7"/>
                        </svg>
                    </div>
                </div>
                <div class="form-row">
                    <label class="form-label" for="pName">Nome</label>
                    <input id="pName" type="text" name="name" required class="form-input">
                </div>
                <div class="form-row">
                    <label class="form-label" for="pAvatar">URL da imagem</label>
                    <input id="pAvatar" type="url" name="avatarUrl" placeholder="https://" class="form-input">
                </div>
                <button type="submit" class="submit-btn">
                    <span>Salvar</span>
                    <span class="submit-arrow" aria-hidden="true">→</span>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
